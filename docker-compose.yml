services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${MIEMIE_IMAGE:-miemie-studio:local}"
    restart: "no"
    command:
      - /opt/venv/bin/alembic
      - -c
      - /app/backend/alembic.ini
      - upgrade
      - head
    working_dir: /app
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MIEMIE_DATABASE_ENABLED: "true"
      MIEMIE_DATABASE_URL: "${MIEMIE_DATABASE_URL:-postgresql+psycopg://miemie:${MIEMIE_POSTGRES_PASSWORD:-}@postgres:5432/miemie}"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${MIEMIE_IMAGE:-miemie-studio:local}"
    restart: unless-stopped
    ports:
      - "${MIEMIE_HOST_BIND:-127.0.0.1}:${MIEMIE_HOST_PORT:-8000}:8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MIEMIE_SERVE_FRONTEND: "true"
      MIEMIE_FRONTEND_PORT: "3000"
      MIEMIE_WORKERS: "${MIEMIE_WORKERS:-2}"
      MIEMIE_RUNTIME_GIT_COMMIT: "${MIEMIE_RUNTIME_GIT_COMMIT:-unknown}"
      MIEMIE_RUNTIME_RUN_MODE: "prod"
      MIEMIE_INSTANCE_ID: "${MIEMIE_INSTANCE_ID:-miemie-studio}"
      MIEMIE_PLATFORM_ENCRYPTION_KEY: "${MIEMIE_PLATFORM_ENCRYPTION_KEY:-}"
      MIEMIE_CORS_ORIGINS: "${MIEMIE_CORS_ORIGINS:-}"
      MIEMIE_REDIS_URL: "${MIEMIE_REDIS_URL:-redis://redis:6379/0}"
      MIEMIE_RATE_LIMIT_STORAGE_URI: "${MIEMIE_RATE_LIMIT_STORAGE_URI:-redis://redis:6379/1}"
      MIEMIE_REDIS_KEY_PREFIX: "${MIEMIE_REDIS_KEY_PREFIX:-miemie}"
      MIEMIE_TASK_DISPATCHER: "${MIEMIE_TASK_DISPATCHER:-celery}"
      MIEMIE_CELERY_BROKER_URL: "${MIEMIE_CELERY_BROKER_URL:-redis://redis:6379/2}"
      MIEMIE_CELERY_RESULT_BACKEND: "${MIEMIE_CELERY_RESULT_BACKEND:-redis://redis:6379/3}"
      MIEMIE_STUDIO_GENERATION_STALE_SECONDS: "${MIEMIE_STUDIO_GENERATION_STALE_SECONDS:-1800}"
      MIEMIE_DATABASE_ENABLED: "${MIEMIE_DATABASE_ENABLED:-true}"
      MIEMIE_DATABASE_URL: "${MIEMIE_DATABASE_URL:-postgresql+psycopg://miemie:${MIEMIE_POSTGRES_PASSWORD:-}@postgres:5432/miemie}"
      MIEMIE_DATABASE_WRITE_MODE: "${MIEMIE_DATABASE_WRITE_MODE:-postgres}"
      MIEMIE_DATABASE_READ_MODE: "${MIEMIE_DATABASE_READ_MODE:-postgres}"
      MIEMIE_DATABASE_DUAL_WRITE_DOMAINS: "${MIEMIE_DATABASE_DUAL_WRITE_DOMAINS:-}"
      MIEMIE_DATABASE_PRIMARY_WRITE_DOMAINS: "${MIEMIE_DATABASE_PRIMARY_WRITE_DOMAINS:-}"
      MIEMIE_DATABASE_READ_DOMAINS: "${MIEMIE_DATABASE_READ_DOMAINS:-}"
      MIEMIE_DATABASE_JSON_FALLBACK_READ: "${MIEMIE_DATABASE_JSON_FALLBACK_READ:-false}"
      MIEMIE_DATABASE_JSON_ARCHIVE_WRITES: "${MIEMIE_DATABASE_JSON_ARCHIVE_WRITES:-false}"
      MIEMIE_DATABASE_RECONCILE_STRICT: "${MIEMIE_DATABASE_RECONCILE_STRICT:-true}"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${MIEMIE_IMAGE:-miemie-studio:local}"
    restart: unless-stopped
    command: ["/opt/venv/bin/celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${MIEMIE_WORKER_CONCURRENCY:-1}", "-Q", "studio"]
    working_dir: /app/backend
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MIEMIE_SERVE_FRONTEND: "true"
      MIEMIE_RUNTIME_GIT_COMMIT: "${MIEMIE_RUNTIME_GIT_COMMIT:-unknown}"
      MIEMIE_RUNTIME_RUN_MODE: "prod"
      MIEMIE_REDIS_URL: "${MIEMIE_REDIS_URL:-redis://redis:6379/0}"
      MIEMIE_REDIS_KEY_PREFIX: "${MIEMIE_REDIS_KEY_PREFIX:-miemie}"
      MIEMIE_CELERY_BROKER_URL: "${MIEMIE_CELERY_BROKER_URL:-redis://redis:6379/2}"
      MIEMIE_CELERY_RESULT_BACKEND: "${MIEMIE_CELERY_RESULT_BACKEND:-redis://redis:6379/3}"
      MIEMIE_STUDIO_GENERATION_STALE_SECONDS: "${MIEMIE_STUDIO_GENERATION_STALE_SECONDS:-1800}"
      MIEMIE_DATABASE_ENABLED: "${MIEMIE_DATABASE_ENABLED:-true}"
      MIEMIE_DATABASE_URL: "${MIEMIE_DATABASE_URL:-postgresql+psycopg://miemie:${MIEMIE_POSTGRES_PASSWORD:-}@postgres:5432/miemie}"
      MIEMIE_DATABASE_WRITE_MODE: "${MIEMIE_DATABASE_WRITE_MODE:-postgres}"
      MIEMIE_DATABASE_READ_MODE: "${MIEMIE_DATABASE_READ_MODE:-postgres}"
      MIEMIE_DATABASE_DUAL_WRITE_DOMAINS: "${MIEMIE_DATABASE_DUAL_WRITE_DOMAINS:-}"
      MIEMIE_DATABASE_PRIMARY_WRITE_DOMAINS: "${MIEMIE_DATABASE_PRIMARY_WRITE_DOMAINS:-}"
      MIEMIE_DATABASE_READ_DOMAINS: "${MIEMIE_DATABASE_READ_DOMAINS:-}"
      MIEMIE_DATABASE_JSON_FALLBACK_READ: "${MIEMIE_DATABASE_JSON_FALLBACK_READ:-false}"
      MIEMIE_DATABASE_JSON_ARCHIVE_WRITES: "${MIEMIE_DATABASE_JSON_ARCHIVE_WRITES:-false}"
      MIEMIE_DATABASE_RECONCILE_STRICT: "${MIEMIE_DATABASE_RECONCILE_STRICT:-true}"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs

  worker-video:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${MIEMIE_IMAGE:-miemie-studio:local}"
    restart: unless-stopped
    command: ["/opt/venv/bin/celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${MIEMIE_VIDEO_WORKER_CONCURRENCY:-1}", "-Q", "video_studio", "--hostname=video@%h"]
    working_dir: /app/backend
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MIEMIE_SERVE_FRONTEND: "true"
      MIEMIE_RUNTIME_GIT_COMMIT: "${MIEMIE_RUNTIME_GIT_COMMIT:-unknown}"
      MIEMIE_RUNTIME_RUN_MODE: "prod"
      MIEMIE_REDIS_URL: "${MIEMIE_REDIS_URL:-redis://redis:6379/0}"
      MIEMIE_REDIS_KEY_PREFIX: "${MIEMIE_REDIS_KEY_PREFIX:-miemie}"
      MIEMIE_CELERY_BROKER_URL: "${MIEMIE_CELERY_BROKER_URL:-redis://redis:6379/2}"
      MIEMIE_CELERY_RESULT_BACKEND: "${MIEMIE_CELERY_RESULT_BACKEND:-redis://redis:6379/3}"
      MIEMIE_VIDEO_STUDIO_DISPATCHER: "${MIEMIE_VIDEO_STUDIO_DISPATCHER:-celery}"
      MIEMIE_VIDEO_STUDIO_SUBMIT_STALE_AFTER_SECONDS: "${MIEMIE_VIDEO_STUDIO_SUBMIT_STALE_AFTER_SECONDS:-1800}"
      MIEMIE_VIDEO_STUDIO_WORKER_STALE_SECONDS: "${MIEMIE_VIDEO_STUDIO_WORKER_STALE_SECONDS:-180}"
      MIEMIE_WORKER_TASK_TIME_LIMIT: "${MIEMIE_VIDEO_WORKER_TASK_TIME_LIMIT:-3600}"
      MIEMIE_WORKER_TASK_SOFT_TIME_LIMIT: "${MIEMIE_VIDEO_WORKER_TASK_SOFT_TIME_LIMIT:-3300}"
      MIEMIE_DATABASE_ENABLED: "${MIEMIE_DATABASE_ENABLED:-true}"
      MIEMIE_DATABASE_URL: "${MIEMIE_DATABASE_URL:-postgresql+psycopg://miemie:${MIEMIE_POSTGRES_PASSWORD:-}@postgres:5432/miemie}"
      MIEMIE_DATABASE_WRITE_MODE: "${MIEMIE_DATABASE_WRITE_MODE:-postgres}"
      MIEMIE_DATABASE_READ_MODE: "${MIEMIE_DATABASE_READ_MODE:-postgres}"
      MIEMIE_DATABASE_DUAL_WRITE_DOMAINS: "${MIEMIE_DATABASE_DUAL_WRITE_DOMAINS:-}"
      MIEMIE_DATABASE_PRIMARY_WRITE_DOMAINS: "${MIEMIE_DATABASE_PRIMARY_WRITE_DOMAINS:-}"
      MIEMIE_DATABASE_READ_DOMAINS: "${MIEMIE_DATABASE_READ_DOMAINS:-}"
      MIEMIE_DATABASE_JSON_FALLBACK_READ: "${MIEMIE_DATABASE_JSON_FALLBACK_READ:-false}"
      MIEMIE_DATABASE_JSON_ARCHIVE_WRITES: "${MIEMIE_DATABASE_JSON_ARCHIVE_WRITES:-false}"
      MIEMIE_DATABASE_RECONCILE_STRICT: "${MIEMIE_DATABASE_RECONCILE_STRICT:-true}"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs

  worker-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${MIEMIE_IMAGE:-miemie-studio:local}"
    restart: unless-stopped
    command: ["/opt/venv/bin/celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${MIEMIE_OPS_WORKER_CONCURRENCY:-1}", "-Q", "ops"]
    working_dir: /app/backend
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MIEMIE_RUNTIME_GIT_COMMIT: "${MIEMIE_RUNTIME_GIT_COMMIT:-unknown}"
      MIEMIE_RUNTIME_RUN_MODE: "prod"
      MIEMIE_INSTANCE_ID: "${MIEMIE_INSTANCE_ID:-miemie-studio}"
      MIEMIE_PLATFORM_ENCRYPTION_KEY: "${MIEMIE_PLATFORM_ENCRYPTION_KEY:-}"
      MIEMIE_REDIS_URL: "${MIEMIE_REDIS_URL:-redis://redis:6379/0}"
      MIEMIE_REDIS_KEY_PREFIX: "${MIEMIE_REDIS_KEY_PREFIX:-miemie}"
      MIEMIE_CELERY_BROKER_URL: "${MIEMIE_CELERY_BROKER_URL:-redis://redis:6379/2}"
      MIEMIE_CELERY_RESULT_BACKEND: "${MIEMIE_CELERY_RESULT_BACKEND:-redis://redis:6379/3}"
      MIEMIE_DATABASE_ENABLED: "${MIEMIE_DATABASE_ENABLED:-true}"
      MIEMIE_DATABASE_URL: "${MIEMIE_DATABASE_URL:-postgresql+psycopg://miemie:${MIEMIE_POSTGRES_PASSWORD:-}@postgres:5432/miemie}"
      MIEMIE_DATABASE_WRITE_MODE: "${MIEMIE_DATABASE_WRITE_MODE:-postgres}"
      MIEMIE_DATABASE_READ_MODE: "${MIEMIE_DATABASE_READ_MODE:-postgres}"
      MIEMIE_DATABASE_JSON_FALLBACK_READ: "false"
      MIEMIE_DATABASE_JSON_ARCHIVE_WRITES: "false"
      MIEMIE_DATABASE_RECONCILE_STRICT: "true"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/logs:/app/backend/logs
      - ./backups:/var/lib/miemie/backups

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${MIEMIE_IMAGE:-miemie-studio:local}"
    restart: unless-stopped
    command: ["/opt/venv/bin/python", "-m", "app.ops_scheduler"]
    working_dir: /app/backend
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MIEMIE_RUNTIME_GIT_COMMIT: "${MIEMIE_RUNTIME_GIT_COMMIT:-unknown}"
      MIEMIE_RUNTIME_RUN_MODE: "prod"
      MIEMIE_INSTANCE_ID: "${MIEMIE_INSTANCE_ID:-miemie-studio}"
      MIEMIE_PLATFORM_ENCRYPTION_KEY: "${MIEMIE_PLATFORM_ENCRYPTION_KEY:-}"
      MIEMIE_REDIS_URL: "${MIEMIE_REDIS_URL:-redis://redis:6379/0}"
      MIEMIE_REDIS_KEY_PREFIX: "${MIEMIE_REDIS_KEY_PREFIX:-miemie}"
      MIEMIE_CELERY_BROKER_URL: "${MIEMIE_CELERY_BROKER_URL:-redis://redis:6379/2}"
      MIEMIE_CELERY_RESULT_BACKEND: "${MIEMIE_CELERY_RESULT_BACKEND:-redis://redis:6379/3}"
      MIEMIE_DATABASE_ENABLED: "${MIEMIE_DATABASE_ENABLED:-true}"
      MIEMIE_DATABASE_URL: "${MIEMIE_DATABASE_URL:-postgresql+psycopg://miemie:${MIEMIE_POSTGRES_PASSWORD:-}@postgres:5432/miemie}"
      MIEMIE_DATABASE_WRITE_MODE: "${MIEMIE_DATABASE_WRITE_MODE:-postgres}"
      MIEMIE_DATABASE_READ_MODE: "${MIEMIE_DATABASE_READ_MODE:-postgres}"
      MIEMIE_DATABASE_JSON_FALLBACK_READ: "false"
      MIEMIE_DATABASE_JSON_ARCHIVE_WRITES: "false"
      MIEMIE_DATABASE_RECONCILE_STRICT: "true"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${MIEMIE_POSTGRES_SHARED_BUFFERS:-128MB}"
      - "-c"
      - "max_connections=${MIEMIE_POSTGRES_MAX_CONNECTIONS:-50}"
      - "-c"
      - "work_mem=${MIEMIE_POSTGRES_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${MIEMIE_POSTGRES_MAINTENANCE_WORK_MEM:-64MB}"
    environment:
      POSTGRES_DB: "${MIEMIE_POSTGRES_DB:-miemie}"
      POSTGRES_USER: "${MIEMIE_POSTGRES_USER:-miemie}"
      POSTGRES_PASSWORD: "${MIEMIE_POSTGRES_PASSWORD:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
  postgres_data:
